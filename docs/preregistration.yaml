# Stage 1 Pre-Registration — Continuous Candle Score Predictivity Test
# =====================================================================
# Spec: docs/CANDLE_SCORING_STAGE1_PREDICTIVITY.md
# Code: docs/stage1_reference.py
#
# The pre-registration has TWO halves, frozen at different times, because they
# protect against different things.
#
#   ANALYSIS half  (status below) - the score, targets, bucketing, hypotheses,
#     trial count and decision gates. These are CHOICES, and choosing them after
#     seeing results is the failure this document exists to prevent. FROZEN NOW.
#
#   DATA half      (data.manifest_status) - period, tick size, timestamp
#     convention, content hashes. These are FACTS about the data, DISCOVERED by
#     running stage1.validate, not chosen. They are stamped by the validator at
#     execution Step 1 and recorded in data/clean/data_manifest.json.
#
# Recording what the data IS carries no degree of freedom, so it does not need
# to precede validation. Recording what will COUNT AS A RESULT does, and it is
# locked below.
#
# Instrument selection is a CHOICE and therefore sits in the analysis half.
# Substituting instruments to obtain adequate statistical power (Step 2) is
# legitimate. Substituting them after seeing any IC, bucket or quadrant number
# is not, and voids the pre-registration.

status: FROZEN_ANALYSIS
prereg_version: 1
stage: 1_predictivity_only
frozen_at: 2026-08-15
frozen_commit: recorded_in_commit_message
history_option: A        # min_obs 250, W 500, blocks of 63, ~7 years/instrument

# ---------------------------------------------------------------------------
# Data — all TODO until sourced and validated (Step 1)
# ---------------------------------------------------------------------------
data:
  manifest_status: PENDING_VALIDATION   # -> VERIFIED once stage1.validate passes

  # ORIGINAL FROZEN SET, retained by operator instruction 2026-08-21.
  # Data-quality measurements below suggest TLT and FXE will fail the
  # admission gates, but the DECISION IS DEFERRED TO THE PIPELINE: the
  # validator's degenerate-bar limit decides, not a judgement call made in
  # advance. If a gate fires, a substitute is proposed at that point, on data
  # adequacy only, and before any IC is computed.
  instruments:
    - SPY      # US large-cap equity
    - TLT      # long duration rates
    - GLD      # gold
    - FXE      # EUR/USD

  # Measured with stage1.hf_quality on 2026-08-21. gap_pre / gap_post are mean
  # daily gap rate (fraction of the 390-bar grid with no trade) before and
  # after the 2022-03-01 IEX break. est_5min_drop is the implied share of
  # 5-minute bins with fewer than 4 of 5 minutes traded.
  instrument_quality_evidence:
    admitted:
      SPY: {gap_pre: 0.0003, gap_post: 0.0285, obs_pre: 388.4, est_5min_drop: 0.0000}
      QQQ: {gap_pre: 0.0003, gap_post: 0.0367, obs_pre: 388.3, est_5min_drop: 0.0000}
      DIA: {gap_pre: 0.0055, gap_post: 0.4145, obs_pre: 386.3, est_5min_drop: 0.0003}
      GLD: {gap_pre: 0.0126, gap_post: 0.3065, obs_pre: 383.6, est_5min_drop: 0.0015}
      IWM: {gap_pre: 0.0134, gap_post: 0.0417, obs_pre: 383.3, est_5min_drop: 0.0017}
      SLV: {gap_pre: 0.0342, gap_post: 0.3513, obs_pre: 375.1, est_5min_drop: 0.0109}
    rejected:
      EFA: {gap_pre: 0.0521, est_5min_drop: 0.0244, reason: "exceeds max_drop_fraction"}
      XLE: {gap_pre: 0.0524, est_5min_drop: 0.0247, reason: "exceeds max_drop_fraction"}
      XLF: {gap_pre: 0.0603, est_5min_drop: 0.0322, reason: "exceeds max_drop_fraction"}
      XLU: {gap_pre: 0.0727, est_5min_drop: 0.0456, reason: "exceeds max_drop_fraction"}
      EEM: {gap_pre: 0.0746, est_5min_drop: 0.0478, reason: "exceeds max_drop_fraction"}
      HYG: {gap_pre: 0.1102, est_5min_drop: 0.0969, reason: "credit; too gappy"}
      TLT: {gap_pre: 0.1149, est_5min_drop: 0.1043, reason: "ORIGINAL PICK; too gappy"}
      LQD: {gap_pre: 0.2228, est_5min_drop: 0.3101, reason: "credit; too gappy"}
      IEF: {gap_pre: 0.2785, est_5min_drop: 0.4271, reason: "rates; too gappy"}
      UUP: {gap_pre: 0.3534, est_5min_drop: 0.5782, reason: "FX; too gappy"}
      FXE: {gap_pre: 0.4728, est_5min_drop: 0.7766, reason: "ORIGINAL PICK; unusable.
             Only 205 of 390 minutes trade pre-break, 17.6 post-break"}

  # CORRECTION 2026-08-21: est_5min_drop below was derived from daily gap_rate
  # assuming independent missing minutes. It materially UNDERSTATES the
  # realised degenerate fraction because gaps cluster within sessions. Measured
  # by running prepare+validate: SPY 3.87% (predicted 0.00%), IWM 4.21%,
  # DIA 5.42%, QQQ 5.58%, GLD 5.82% (predicted 0.15%), TLT 15.19% (predicted
  # 10.43%), SLV 46.95%, FXE 66.08%. Screening on gap_rate is not a substitute
  # for running the pipeline.
  #
  # RUN 1 OUTCOME (results/run1/run_report.json): validate REJECTED TLT, GLD
  # and FXE. Only SPY and IWM clear invalid_bar_abort_threshold, and both are
  # US equity, so the achievable K_eff is near 1. No IC was computed.
  #
  # These measurements are EVIDENCE, not a decision. The pipeline decides:
  # stage1.validate aborts an instrument whose degenerate-bar share exceeds
  # invalid_bar_abort_threshold (0.05). Whatever survives that gate is the
  # universe, and Step 2 then measures the real K_eff.
  base_timeframe: 5min        # FROZEN
  secondary_timeframe: 1min   # FROZEN (used only in execution step 11)

  # Source decided 2026-08-15, before any result was computed.
  source: hfdatalibrary.com   # 1-min OHLCV, resampled by stage1.hf_prepare
  era_restriction: pre_iex_break
  era_end: 2022-02-28
  # The vendor discloses an IEX source break on 2022-03-01. Stage 1 uses no
  # volume, but IEX-only bars are built from a sparse subset of the tape, so
  # their HIGH and LOW are attenuated - which corrupts every geometry ratio
  # this study measures. That is a change of measurement instrument, not a
  # volume caveat, so the eras are not pooled. Confirm empirically with
  # stage1.hf_quality (gap-rate tolerance 0.02) and record its table here.
  # Cost of the restriction: none. Common history from FXE's Dec-2005 launch
  # to the break is ~4,050 sessions against the 1,762 Option A requires.
  # CONFIRMED EMPIRICALLY 2026-08-21. The break is material on 3 of the 4
  # originally proposed instruments: SPY gap rate 0.03% -> 2.85%, GLD 1.3% ->
  # 30.7%, FXE 47.3% -> 95.5% (17.6 of 390 minutes trading). The bars
  # themselves are sparser after the break, not just the volumes, so the
  # pre-registered restriction to the pre-break era stands.
  known_limitations:
    - "Pre-2022 only: says nothing about the current microstructure regime."
    - "Vendor flags a survivor-biased universe pre-2022. Stage 1 names four
       surviving ETFs rather than screening, so no selection is performed on
       the data, but results generalise to major liquid ETFs only."
    - "MEASURED RISK to the four-macro-driver design: no rates, credit or FX
       instrument in this library clears the data-quality admission rule at
       1-minute resolution (TLT 10.4% estimated bin drop, IEF 42.7%, UUP
       57.8%, FXE 77.7%). If the validator rejects TLT and FXE, the surviving
       set is equity plus metals only, K_eff falls toward 2, and any result
       generalises no wider than liquid US equity and metals ETFs."

  # Resampling rules, fixed before any result. 1-min -> 5-min.
  resampling:
    rth_filter_before_aggregation: true
    bins_cross_session: forbidden
    min_minutes_per_bar: 4        # of 5; short bins have attenuated range
    incomplete_bin_policy: drop_and_leave_nan_hole
    forward_fill: forbidden
    max_drop_fraction: 0.02
    strict_forward_spacing: true  # r_h requires a successor exactly h*5 min later
  # Everything below is STAMPED BY THE VALIDATOR, not declared by hand.
  period:
    start: PENDING
    end: PENDING
  holdout_sealed:             # last 252 sessions; single look, at execution step 14
    start: PENDING
    end: PENDING
  vendor: PENDING
  session_hours: "09:30-16:00 America/New_York, RTH only"
  extended_hours_policy: exclude   # FROZEN — RTH only; see red flags in spec
  bar_timestamp_convention: PENDING   # open_labelled | close_labelled — VERIFY, never assume
  timezone_of_raw_stamps: PENDING     # e.g. "epoch_ms_utc"
  adjustment_convention: PENDING      # multiplicative | additive | none
  tick_size: PENDING
  session_calendar_source: PENDING    # must include holidays AND half-days
  snapshot_hash: PENDING              # sha256 of the immutable local copy

# ---------------------------------------------------------------------------
# Score — FROZEN, zero fitted parameters
# ---------------------------------------------------------------------------
score:
  primitives:
    R: H - L
    B: C - O
    U: H - max(O, C)
    D: min(O, C) - L
  components:
    BD: B / R
    CL: (2C - H - L) / R
    SA: (D - U) / R
    WB: (U + D) / R
    CONV: 1 - WB
  DIR: (BD + CL + SA) / 3
  DQ: DIR * CONV^gamma * w_range
  gamma: 1.0
  degenerate_gate:
    k_tick: 2.0
    k_vol: 0.10
    atr_n: 20
    atr_excludes_current_bar: true
  w_range: R / (R + eps)
  zero_range_policy: NaN        # never 0 — see spec 1.4
  invalid_bar_policy: flag_never_drop
  invalid_bar_abort_threshold: 0.05
  normalisation:
    type: trailing_percentile
    strictly_prior: true
    tod_bucketed: true
    tod_slot_minutes: 30        # FROZEN — see spec 1.5 for why not 5
    window: 500                 # revisit only via history option B, before freeze
    min_obs: 250                # revisit only via history option B, before freeze
  group:
    methods: [merge, agg]
    k: [2, 3, 4]
    rho: 0.70
    cross_session: forbidden

# ---------------------------------------------------------------------------
# Targets — FROZEN
# ---------------------------------------------------------------------------
targets:
  primary: r_1
  continuous: [r_1, r_2, r_3]
  binary: [y_1, y_2, y_3]
  diagnostic_only: [y_body]
  atr_normaliser: ATR_20(t-1)
  same_session_required: true
  zero_move_policy:
    binary: exclude
    continuous: retain

# ---------------------------------------------------------------------------
# Bucketing — FROZEN
# ---------------------------------------------------------------------------
bucketing:
  view1: {type: decile, on: DQ_pct}
  view2: {type: quadrant, x: sign(DIR), y: CONV_pct >= 0.5}
  view3: {type: grid_5x5, x: DIR_pct, y: CONV_pct, diagnostic_only: true}
  extremes: ["0.00-0.10", "0.90-1.00"]
  middle: ["0.40-0.60"]
  baseline_formula: "pi_0(q) = f_q * P(r>0) + (1 - f_q) * P(r<0)"
  zero_crossing_bucket: flag_and_exclude    # the decile with 0 < f_q < 1

# ---------------------------------------------------------------------------
# Evaluation — FROZEN except where noted
# ---------------------------------------------------------------------------
evaluation:
  history_option: A             # LOCKED: min_obs 250, W 500, ~7 years/instrument
  blocks:
    length_sessions: 63         # Option A
    min_blocks: 20              # CALENDAR blocks, not instrument-blocks
    overlapping: false
  warmup_sessions: 250          # min_obs=250 same-slot observations
  holdout_sessions: 252
  min_history_sessions: 1762    # 250 + 1260 + 252
  rolling_view: {window: 126, step: 21, statistical_weight: none}
  bootstrap: {type: stationary_block, mean_block: 78, resamples: 10000}
  permutation: {draws: 1000, preserve: [marginals, time_of_day_mix]}
  n_eff_required: true
  ic_method: spearman

# ---------------------------------------------------------------------------
# Hypotheses — SIGNS FIXED BEFORE TESTING. A reversal is a rejection (K7).
# ---------------------------------------------------------------------------
hypotheses:
  H1: "mean r_1 ordering: Q1_clean_bull > Q2_messy_bull > 0 > Q3_messy_bear > Q4_clean_bear"
  H2: "quadrant spread mean r_1(Q1) - mean r_1(Q4) > 0"
  H3: "|mean r_1| is larger in the extreme DQ_pct buckets than in the middle bucket"

# ---------------------------------------------------------------------------
# Trial accounting — APPEND ONLY. Every executed test increments, including
# tests run and abandoned. A test run and not reported is p-hacking.
# ---------------------------------------------------------------------------
n_trials_declared: 59
n_trials_executed: 0
trial_log: []      # {id, date, description, result_summary}

expected_effect_size:
  IC: [0.01, 0.03]
  lift_pp: [1, 3]
suspicion_threshold:    # above this, assume a bug and re-run all 5.6 gates
  IC: 0.05
  lift_pp: 5

# ---------------------------------------------------------------------------
# Decision gates — FROZEN
# ---------------------------------------------------------------------------
decision_gates:
  detected_requires_all: [G1, G2, G3, G4, G5, G6, G7]
  G1: "|mean IC| >= 0.010 on r_1"
  G2: "IC t-statistic >= 3.0 on n_eff, block-bootstrap se"
  G3: "consistency ratio >= 0.65 of blocks with pre-registered sign"
  G4: "Jonckheere-Terpstra p < 0.05 AND bucket-index Spearman rho >= 0.60"
  G5: "quadrant spread H2 > 0, 95% CI excludes zero, H1 ordering respected"
  G6: "permutation p < 0.01 AND survives BH-FDR at q = 0.10"
  G7: "composite DQ beats its best single component (BD, CL, SA) on mean IC"
  none_if_any: [K1, K2, K3, K4, K5, K6, K7, K8]
  K1: "|mean IC| < 0.005 or IC t < 1.5"
  K2: "consistency ratio < 0.50"
  K3: "no monotonicity (JT p > 0.10) AND no significant extreme-vs-middle difference"
  K4: "quadrant spread H2 CI includes zero"
  K5: "observed statistic inside permutation null central 95%"
  K6: "effect present in only one or two of >= 20 blocks"
  K7: "sign is the REVERSE of pre-registered H1, at any strength"
  K8: "any 5.6 pipeline gate fails"

default_verdict: no_useful_predictivity

negative_conclusion_text: >
  A continuous score built from single-candle OHLC geometry shows no
  statistically detectable information about near-term forward returns at the
  tested horizons. The idea is not carried forward to filter testing.
